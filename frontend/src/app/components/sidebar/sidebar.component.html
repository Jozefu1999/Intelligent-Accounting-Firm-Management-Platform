<aside class="expert-sidebar">
  <div class="expert-brand">
    <div class="expert-logo">
      <mat-icon class="text-[16px]">account_balance</mat-icon>
    </div>
    <div>
      <p class="expert-brand-title">Accounting Platform</p>
      <p class="expert-brand-subtitle">{{ workspaceLabel }}</p>
    </div>
  </div>

  <div class="expert-nav-wrap">
    <nav class="expert-nav" aria-label="Main navigation">
      @for (item of primaryNavItems; track trackByPath($index, item)) {
        <a
          [routerLink]="item.path"
          [fragment]="item.fragment"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="expert-nav-item"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    @if (aiNavItems.length > 0) {
      <p class="expert-nav-group-label">AI TOOLS</p>

      <nav class="expert-nav expert-nav-ai" aria-label="AI tools">
        @for (item of aiNavItems; track trackByPath($index, item)) {
          <a
            [routerLink]="item.path"
            [fragment]="item.fragment"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="expert-nav-item"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    }
  </div>

  <div class="expert-sidebar-footer">
    <button type="button" class="expert-logout" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Log out</span>
    </button>
  </div>
</aside>
