<div class="mx-auto max-w-3xl">
	<div class="mb-6 flex flex-wrap items-center justify-between gap-4">
		<div>
			<h1 class="text-[1.5rem] font-bold tracking-tight text-[#0f172a]">
				{{ isEditMode ? 'Edit project' : 'New project' }}
			</h1>
			<p class="mt-1 text-[0.82rem] text-[#64748b]">Define project details and assignment.</p>
		</div>

		<a [routerLink]="listRoute" class="inline-flex items-center gap-1.5 rounded-[0.7rem] border border-[#e2e8f0] bg-white px-3 py-2 text-[0.82rem] font-semibold text-[#64748b] hover:bg-[#f1f5f9]">
			<mat-icon class="text-[16px]">arrow_back</mat-icon>
			Back
		</a>
	</div>

	@if (errorMessage) {
		<div class="mb-5 flex items-start gap-2 rounded-[0.7rem] border border-red-200 bg-red-50 px-4 py-2.5 text-[0.82rem] text-red-700">
			<mat-icon class="text-base">error_outline</mat-icon>
			<span>{{ errorMessage }}</span>
		</div>
	}

	<div class="rounded-[0.75rem] border border-[#e2e8f0] bg-white p-6 sm:p-8">
		@if (isLoading) {
			<div class="py-12 text-center text-[0.82rem] text-[#94a3b8]">Loading project data...</div>
		} @else {
			<form (ngSubmit)="onSubmit()" class="space-y-5">
				<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
						<div class="sm:col-span-2">
						<label class="mb-1 block text-[0.8rem] font-semibold text-[#0f172a]">Project name</label>
						<input
							type="text"
							[(ngModel)]="name"
							name="name"
							required
							placeholder="Tax Optimization 2026"
							class="w-full rounded-[0.7rem] border border-[#cbd5e1] px-3.5 py-2.5 text-[0.84rem] text-[#0f172a] outline-none placeholder:text-[#94a3b8] focus:border-[#2563eb] focus:ring-[3px] focus:ring-[rgba(37,99,235,0.15)]"
						/>
					</div>

					<div>
						<label class="mb-1 block text-[0.8rem] font-semibold text-[#0f172a]">Type</label>
						<select
							[(ngModel)]="type"
							name="type"
							class="w-full rounded-[0.7rem] border border-[#cbd5e1] bg-white px-3.5 py-2.5 text-[0.84rem] text-[#0f172a] outline-none focus:border-[#2563eb] focus:ring-[3px] focus:ring-[rgba(37,99,235,0.15)]"
						>
							<option value="creation">Creation</option>
							<option value="development">Development</option>
							<option value="audit">Audit</option>
							<option value="consulting">Consulting</option>
							<option value="other">Other</option>
						</select>
					</div>

					<div>
						<label class="mb-1 block text-[0.8rem] font-semibold text-[#0f172a]">Status</label>
						<select
							[(ngModel)]="status"
							name="status"
							class="w-full rounded-[0.7rem] border border-[#cbd5e1] bg-white px-3.5 py-2.5 text-[0.84rem] text-[#0f172a] outline-none focus:border-[#2563eb] focus:ring-[3px] focus:ring-[rgba(37,99,235,0.15)]"
						>
							<option value="draft">Draft</option>
							<option value="in_progress">In progress</option>
							<option value="completed">Completed</option>
							<option value="cancelled">Cancelled</option>
						</select>
					</div>

					<div>
						<label class="mb-1 block text-[0.8rem] font-semibold text-[#0f172a]">Priority</label>
						<select
							[(ngModel)]="priority"
							name="priority"
							class="w-full rounded-[0.7rem] border border-[#cbd5e1] bg-white px-3.5 py-2.5 text-[0.84rem] text-[#0f172a] outline-none focus:border-[#2563eb] focus:ring-[3px] focus:ring-[rgba(37,99,235,0.15)]"
						>
							<option value="low">Low</option>
							<option value="medium">Medium</option>
							<option value="high">High</option>
						</select>
					</div>

					<div>
						<label class="mb-1 block text-[0.8rem] font-semibold text-[#0f172a]">Start date</label>
						<input
							type="date"
							[(ngModel)]="startDate"
							name="startDate"
							class="w-full rounded-[0.7rem] border border-[#cbd5e1] px-3.5 py-2.5 text-[0.84rem] text-[#0f172a] outline-none focus:border-[#2563eb] focus:ring-[3px] focus:ring-[rgba(37,99,235,0.15)]"
						/>
					</div>
				</div>

				<div>
					<label class="mb-1 block text-[0.8rem] font-semibold text-[#0f172a]">Due date</label>
					<input
						type="date"
						[(ngModel)]="dueDate"
						name="dueDate"
						class="w-full rounded-[0.7rem] border border-[#cbd5e1] px-3.5 py-2.5 text-[0.84rem] text-[#0f172a] outline-none focus:border-[#2563eb] focus:ring-[3px] focus:ring-[rgba(37,99,235,0.15)]"
					/>
				</div>

				<div>
					<label class="mb-1 block text-[0.8rem] font-semibold text-[#0f172a]">Description</label>
					<textarea
						[(ngModel)]="description"
						name="description"
						rows="4"
						placeholder="Project details"
						class="w-full rounded-[0.7rem] border border-[#cbd5e1] px-3.5 py-2.5 text-[0.84rem] text-[#0f172a] outline-none placeholder:text-[#94a3b8] focus:border-[#2563eb] focus:ring-[3px] focus:ring-[rgba(37,99,235,0.15)]"
					></textarea>
				</div>

				<div class="flex flex-wrap items-center justify-end gap-3 border-t border-[#f1f5f9] pt-4">
					<a [routerLink]="listRoute" class="rounded-[0.7rem] px-4 py-2 text-[0.82rem] font-semibold text-[#64748b] hover:bg-[#f1f5f9]">Cancel</a>

					<button type="submit" [disabled]="isSubmitting" class="inline-flex items-center gap-1.5 rounded-[0.7rem] bg-[#2563eb] px-4 py-2.5 text-[0.82rem] font-semibold text-white hover:bg-[#1d4ed8] disabled:opacity-55">
						@if (isSubmitting) {
							<mat-icon class="animate-spin text-[16px]">refresh</mat-icon>
							<span>{{ isEditMode ? 'Saving...' : 'Creating...' }}</span>
						} @else {
							<span>{{ isEditMode ? 'Save project' : 'Create project' }}</span>
						}
					</button>
				</div>
			</form>
		}
	</div>
</div>
