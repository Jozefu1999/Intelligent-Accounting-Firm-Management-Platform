<div class="relative flex min-h-screen items-center justify-center bg-[#f9fafb] px-4 py-12">
  <a routerLink="/landing" class="absolute left-6 top-6 flex items-center gap-1.5 rounded-lg border border-[#e5e7eb] bg-white px-3 py-2 text-sm font-medium text-[#374151] transition hover:border-[#2563eb]/30 hover:text-[#2563eb]">
    <mat-icon class="text-[1rem]">arrow_back</mat-icon>
    Back to Home
  </a>

  <div class="auth-card-enter w-full max-w-[400px]">
    <div class="mb-8">
      <div class="mb-6 flex items-center gap-2">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-[#2563eb] text-xs font-bold text-white">EC</span>
        <span class="text-sm font-semibold text-[#111827]">MD Audit</span>
      </div>
      <h1 class="text-xl font-semibold tracking-tight text-[#111827]">Sign in to your account</h1>
      <p class="mt-1 text-sm text-[#6b7280]">Enter your credentials to access your workspace.</p>
    </div>

    @if (errorMessage) {
      <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2.5 text-sm text-red-700">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-[#374151]">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          autocomplete="email"
          placeholder="you@company.com"
          class="w-full rounded-lg border border-[#e5e7eb] bg-white px-3 py-2.5 text-sm text-[#111827] outline-none transition placeholder:text-[#9ca3af] focus:border-[#2563eb] focus:ring-2 focus:ring-[#2563eb]/10"
        />
      </div>

      <div>
        <label class="mb-1.5 block text-sm font-medium text-[#374151]">Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="Your password"
          class="w-full rounded-lg border border-[#e5e7eb] bg-white px-3 py-2.5 text-sm text-[#111827] outline-none transition placeholder:text-[#9ca3af] focus:border-[#2563eb] focus:ring-2 focus:ring-[#2563eb]/10"
        />
      </div>

      <div class="flex items-center justify-end">
        <a routerLink="/forgot-password" class="text-sm font-medium text-[#2563eb] hover:underline">Forgot password?</a>
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="flex w-full items-center justify-center gap-2 rounded-lg bg-[#111827] px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-[#1f2937] disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (loading) {
          <mat-icon class="animate-spin text-base">refresh</mat-icon>
          Signing in...
        } @else {
          Sign in
        }
      </button>
    </form>

    <div class="my-5 flex items-center gap-3">
      <div class="h-px flex-1 bg-[#e5e7eb]"></div>
      <span class="text-xs text-[#9ca3af]">or</span>
      <div class="h-px flex-1 bg-[#e5e7eb]"></div>
    </div>

    <button
      type="button"
      (click)="signInWithGoogle()"
      [disabled]="loading"
      class="flex w-full items-center justify-center gap-2 rounded-lg border border-[#e5e7eb] bg-white px-4 py-2.5 text-sm font-medium text-[#374151] transition hover:bg-[#f9fafb] disabled:opacity-50"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <p class="mt-6 text-center text-sm text-[#6b7280]">
      Don't have an account?
      <a routerLink="/register" class="font-medium text-[#2563eb] hover:underline">Create account</a>
    </p>
  </div>
</div>
