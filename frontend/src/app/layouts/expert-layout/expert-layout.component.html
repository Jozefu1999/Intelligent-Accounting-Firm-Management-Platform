<div class="shell">
  <button
    type="button"
    class="sidebar-backdrop"
    [class.visible]="isSidebarOpen"
    aria-label="Close menu"
    (click)="closeSidebar()"
  ></button>

  <aside class="sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-header">
      <span class="sidebar-logo">EC</span>
      <span class="sidebar-title">MD Audit</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/expert/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>space_dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a routerLink="/expert/clients" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>people</mat-icon>
        <span>Clients</span>
      </a>
      <a routerLink="/expert/projects" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>assignment</mat-icon>
        <span>Projects</span>
      </a>
      <a routerLink="/expert/assistants" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>support_agent</mat-icon>
        <span>Assistants</span>
      </a>

      <p class="nav-section-label">AI Tools</p>
      <a routerLink="/expert/ai-tools/business-plan" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>auto_awesome</mat-icon>
        <span>Business Plan</span>
      </a>
      <a routerLink="/expert/ai-tools/recommendations" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>lightbulb</mat-icon>
        <span>Recommendations</span>
      </a>
      <a routerLink="/expert/ai-tools/risk-prediction" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>warning</mat-icon>
        <span>Risk Prediction</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <span class="user-name">{{ userDisplayName }}</span>
        <span class="user-role">Expert</span>
      </div>
      <button type="button" class="sidebar-logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button type="button" class="menu-toggle" (click)="toggleSidebar()" aria-label="Open menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="topbar-date">{{ todayLabel }}</span>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
