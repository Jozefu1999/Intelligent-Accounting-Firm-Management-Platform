<div class="shell">
  <button
    type="button"
    class="sidebar-backdrop"
    [class.visible]="isSidebarOpen"
    aria-label="Close menu"
    (click)="closeSidebar()"
  ></button>

  <aside class="sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-header">
      <span class="sidebar-logo">EC</span>
      <span class="sidebar-title">ExpertCompta</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>space_dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>manage_accounts</mat-icon>
        <span>Users</span>
      </a>
      <a routerLink="/admin/statistics" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>bar_chart</mat-icon>
        <span>Statistics</span>
      </a>
      <a routerLink="/admin/ml" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" (click)="closeSidebar()">
        <mat-icon>model_training</mat-icon>
        <span>ML Model</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <span class="user-name">{{ fullName || 'Administrator' }}</span>
        <span class="user-role">Admin</span>
      </div>
      <button type="button" class="sidebar-logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button type="button" class="menu-toggle" (click)="toggleSidebar()" aria-label="Open menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="topbar-title">{{ pageTitle }}</span>
      <span class="topbar-date">{{ todayLabel }}</span>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
